name: Update Avatar CSS

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:        # Allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download avatar CSS files
        run: |
          mkdir -p avatars
          for year in 2025 2026 2027; do
            url="https://ftc-scoring.firstinspires.org/avatars/composed/${year}.css"
            if curl -sf "$url" -o "avatars/${year}.css"; then
              echo "Downloaded ${year}.css"
            else
              echo "Skipped ${year}.css (not available yet)"
            fi
          done

      - name: Commit if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add avatars/
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update FTC avatar CSS" && git push)
